<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haluweb - App Layout</title>
    <style>
        body, html { margin: 0; padding: 0; background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; }
        #loader { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #0f0; }
        .spinner { border: 4px solid #111; width: 40px; height: 40px; border-radius: 50%; border-top-color: #0f0; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Forces the AI to keep content contained and app-like */
        #website-container { width: 100%; display: none; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Architecting web UI (2000 token limit)...</p>
    </div>
    <div id="website-container"></div>

    <script>
        let key = localStorage.getItem("haluweb_key");
        if (!key) { key = prompt("API Key:"); localStorage.setItem("haluweb_key", key); }

        // UPDATED: Now forces specific UI components instead of blog text
        const SYSTEM_PROMPT = `
        You are a chaotic Frontend Web Developer. Build a single-page web app.
        
        STRUCTURE REQUIREMENTS:
        1. NO LONG ARTICLES. You must use UI components:
           - Navbar (with fake links)
           - Hero Section (Title + CTA Button)
           - Feature Grid (Cards with icons/images)
           - A Footer with fake links
        2. INTERACTIVITY: Every button MUST trigger a JavaScript alert('PRANK'). 
        3. DESIGN: Dark-mode theme, glassmorphism effects, flexbox/grid only.
        4. IMAGES: Use picsum.photos for all placeholder images.
        
        Output raw HTML/CSS only. No markdown.
        `;

        async function generate() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash-lite", 
                        "max_tokens": 2000, 
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Build a modern, dark-mode web app landing page." }
                        ]
                    })
                });

                const data = await response.json();
                let html = data.choices[0].message.content.replace(/```html/g, "").replace(/```/g, "").trim();
                document.getElementById('loader').style.display = 'none';
                const cont = document.getElementById('website-container');
                cont.innerHTML = html;
                cont.style.display = 'block';
            } catch (err) {
                alert("Generation failed: " + err.message);
            }
        }
        generate();
    </script>
</body>
</html>
