<script>
        const OPENROUTER_API_KEY = "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";
        const SYSTEM_PROMPT = "You are Haluweb, a chaotic, hilarious AI. Generate a complete HTML page including CSS. Look like an absurd business or startup. Output ONLY valid, raw HTML. No markdown.";

        async function generateHaluweb() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + OPENROUTER_API_KEY,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://pasterpo.github.io/HaluWeb/",
                        "X-Title": "HaluWeb"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash-lite",
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Invent a hilarious and completely random new website layout and concept right now." }
                        ]
                    })
                });

                if (!response.ok) throw new Error("HTTP error " + response.status);

                const data = await response.json();
                let content = data.choices[0].message.content;
                
                // FIXED: This removes the syntax error by using split/join instead of complex Regex
                let aiHtml = content.split("```html").join("");
                aiHtml = aiHtml.split("```").join("");
                aiHtml = aiHtml.trim();

                document.getElementById('loader').style.display = 'none';
                document.getElementById('website-container').innerHTML = aiHtml;
                
                const aiTitle = document.querySelector("#website-container title");
                if (aiTitle) document.title = aiTitle.innerText;

            } catch (error) {
                console.error("Full Error:", error);
                document.getElementById('spinny-thing').style.display = 'none';
                document.getElementById('status-text').innerHTML = "🛑 Reality collapsed!";
                const errorDiv = document.getElementById('error-details');
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Error: " + error.message;
            }
        }

        generateHaluweb();
    </script>
