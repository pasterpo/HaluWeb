<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haluweb - Loading Reality...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #0f0f16; /* Fallback background */
        }
        #loader {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 22px;
            background: #0f0f16;
            color: #00ffcc;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0,255,204,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #website-container {
            width: 100%;
            height: 100%;
            background: white; /* Ensure generated content has a background */
        }

        /* Style for the detailed error message */
        #error-details {
            margin-top: 20px;
            font-size: 14px;
            color: #ff5555;
            background: rgba(255,0,0,0.1);
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
            word-wrap: break-word;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner" id="spinny-thing"></div>
        <div id="status-text">🔮 Haluweb is shifting dimensions...<br><span style="font-size: 14px; color: #888;">Generating a deeply ridiculous website...</span></div>
        <div id="error-details"></div>
    </div>

    <div id="website-container"></div>

    <script>
        const OPENROUTER_API_KEY = "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";

        const SYSTEM_PROMPT = `
       You are HaluWeb, an AI that generates complete, hilarious, fully-designed single-page fake websites.\n\nIMPORTANT RULES:\n1. Output ONLY raw HTML. No markdown, no backticks, no explanation.\n2. The page must be visually polished with CSS inside a <style> tag.\n3. CRITICAL LAYOUT: Always center the page and the page should look great on all screens.\n4. Include: header/hero, at least 3 sections (services/products/about/testimonials/etc), and a footer.\n5. Be funny, absurd, and specific. Create fake employee names, addresses, emails, phone numbers, testimonials, prices.\n6. Must look like a REAL website for a fake, ridiculous business from an alternate universe.\n7. VARY the design every time: different color palettes, layouts, font styles, aesthetics.\n8. Add hover effects, button styles, and visual polish.\n9. Earnest tone — the business genuinely believes in its absurd services.\n10. Include fake contact info and footer with copyright year.\n11. No external images — use CSS shapes, emoji, or unicode.\n12. LAST LINE must be exactly: TITLE: [the website name here]\n\nVARIETY IS CRITICAL — rotate between:\n- Business types: grooming, law firm, restaurant, consulting, museum, travel, delivery, school, clinic, real estate, news blog, shop, government office, club, gym, hotel, theater, bank, farm, factory\n- Themes: medieval, sci-fi, underwater, prehistoric, interdimensional, fairy tale, cyberpunk, wild west, ancient civilization, post-apocalyptic, steampunk, supernatural, pirate, space, jungle, arctic\n- Color palettes: terracotta+cream, neon green+black, pastel pink+navy, blood red+gold, mint+charcoal, electric blue+white, burnt orange+dark brown, lavender+forest green\n- Layout styles: newspaper, brutalist, minimalist, maximalist retro, corporate, magazine, old internet geocities, luxury brand, playful children, horror, academic.
        `;

        async function generateHaluweb() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json",
                        // Adding these headers helps OpenRouter identify frontend requests
                        "HTTP-Referer": "https://pasterpo.github.io/HaluWeb/", 
                        "X-Title": "HaluWeb"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash-lite", // Forcing Gemini first as it often has higher free limits
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Invent a hilarious and completely random new website layout and concept right now." }
                        ]
                    })
                });

                // Check if the response is actually OK before trying to parse the JSON
                if (!response.ok) {
                    const errorText = await response.text(); // Read the raw error from OpenRouter
                    throw new Error(`OpenRouter Error ${response.status}: ${errorText}`);
                }

                const data = await response.json();

                if (!data.choices || data.choices.length === 0) {
                    throw new Error("API responded, but returned no choices.");
                }

                let aiHtml = data.choices[0].message.content;
                aiHtml = aiHtml.replace(/```html/g, "").replace(/```/g, "").trim();

                document.getElementById('loader').style.display = 'none';
                document.getElementById('website-container').innerHTML = aiHtml;

                const aiTitle = document.querySelector("#website-container title");
                if (aiTitle) document.title = aiTitle.innerText;

            } catch (error) {
                console.error("Full Error:", error);

                // Update UI to show the error
                document.getElementById('spinny-thing').style.display = 'none';
                document.getElementById('status-text').innerHTML = "🛑 The reality portal collapsed!";

                const errorDiv = document.getElementById('error-details');
                errorDiv.style.display = 'block';
                // Show exactly what the error is
                errorDiv.innerText = "Technical details: " + error.message;
            }
        }

        generateHaluweb();
    </script>
</body>
</html>
