<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haluweb - Loading Reality...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0f0f16;
        }
        #loader {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 22px;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0,255,204,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #website-container {
            width: 100%;
            min-height: 100vh;
            background: white;
            display: none;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="status-text">🔮 Shifting dimensions...<br><span style="font-size: 14px; color: #888;">Harvesting peak internet chaos...</span></div>
    </div>
    
    <div id="website-container"></div>

    <script>
        // THE HACK: Ask the user for the key and save it to their browser memory
        let OPENROUTER_API_KEY = localStorage.getItem("haluweb_key");
        if (!OPENROUTER_API_KEY || OPENROUTER_API_KEY === "null") {
            OPENROUTER_API_KEY = prompt("🔑 SECURITY BYPASS: Enter your OpenRouter API Key to start Haluweb:");
            localStorage.setItem("haluweb_key", OPENROUTER_API_KEY);
        }

        const SYSTEM_PROMPT = `
        You are Haluweb, a chaotic, hilarious AI that invents completely fake, bizarre single-page websites.
        
        STRICT RULES FOR TOKENS & LAYOUT:
        1. KEEP IT SHORT. Max 2 or 3 distinct sections.
        2. Design it to look beautiful and normal on a full-screen desktop layout, but make the text completely unhinged.
        
        STRICT RULE FOR IMAGES:
        You MUST use this URL format for images: "https://picsum.photos/seed/{random_word}/400/300". 
        Replace {random_word} with a word related to your concept. NEVER invent your own URLs.
        
        BUTTON LOGIC:
        Every button must have a funny inline JavaScript 'onclick' alert that pranks the user.

        Output ONLY valid, raw HTML code. Do NOT wrap it in markdown code blocks (\`\`\`html).
        `;

        async function generateHaluweb() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://pasterpo.github.io/HaluWeb/", 
                        "X-Title": "HaluWeb"
                    },
                    body: JSON.stringify({
                        // Using Llama 3.1 8B as it is extremely fast, free, and highly reliable
                        "model": "meta-llama/llama-3.1-8b-instruct:free", 
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Generate a fast, short, full-screen, funny website with working Picsum images." }
                        ]
                    })
                });

                // If the key is dead or disabled, this clears it from memory so you can type a new one!
                if (response.status === 401) {
                    localStorage.removeItem("haluweb_key");
                    throw new Error("API Key rejected. I deleted it. Refresh the page to enter a working key!");
                }
                
                if (!response.ok) throw new Error("API Error: Servers might be busy.");

                const data = await response.json();
                let aiHtml = data.choices[0].message.content;
                aiHtml = aiHtml.replace(/```html/g, "").replace(/```/g, "").trim();

                document.getElementById('loader').style.display = 'none';
                const container = document.getElementById('website-container');
                container.innerHTML = aiHtml;
                container.style.display = 'block';
                
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = `🛑 ${error.message}`;
            }
        }

        if (OPENROUTER_API_KEY) {
            generateHaluweb();
        } else {
            document.getElementById('loader').innerHTML = "🛑 You didn't enter a key! Refresh to try again.";
        }
    </script>
</body>
</html>
