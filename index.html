<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haluweb - Loading Reality...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0f0f16;
            font-family: system-ui, sans-serif;
        }
        #loader {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 22px;
            color: #00ffcc;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0,255,204,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #error-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid #ff5555;
            color: #ff5555;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            text-align: left;
            font-size: 14px;
        }

        #website-container {
            width: 100%;
            min-height: 100vh;
            background: white;
            display: none;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner" id="spin-ring"></div>
        <div id="status-text">🔮 Shifting dimensions...<br><span style="font-size: 14px; color: #888;">Harvesting peak internet chaos... (Max wait: 15s)</span></div>
        <div id="error-box"></div>
    </div>
    
    <div id="website-container"></div>

    <script>
        // Check local storage for the API key so it isn't exposed in the code
        let OPENROUTER_API_KEY = localStorage.getItem("haluweb_key");
        if (!OPENROUTER_API_KEY || OPENROUTER_API_KEY === "null") {
            OPENROUTER_API_KEY = prompt("🔑 SECURITY BYPASS: Enter your OpenRouter API Key to start Haluweb:");
            localStorage.setItem("haluweb_key", OPENROUTER_API_KEY);
        }

        const SYSTEM_PROMPT = `
        You are Haluweb, a chaotic, hilarious AI that invents completely fake, bizarre single-page websites.
        
        STRICT RULES FOR TOKENS & LAYOUT:
        1. KEEP IT SHORT. Max 2 distinct sections.
        2. Design it to look beautiful on a full-screen desktop, but make the text completely unhinged.
        
        STRICT RULE FOR IMAGES:
        You MUST use this URL format for images: "https://picsum.photos/seed/{random_word}/400/300". 
        Replace {random_word} with a word related to your concept. NEVER invent your own URLs.
        
        BUTTON LOGIC:
        Every button must have a funny inline JavaScript 'onclick' alert.

        Output ONLY valid, raw HTML code. Do NOT wrap it in markdown code blocks (\`\`\`html).
        `;

        // Helper function to create a 15-second timeout
        const fetchWithTimeout = async (resource, options) => {
            const { timeout = 15000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, {
                ...options,
                signal: controller.signal  
            });
            clearTimeout(id);
            return response;
        };

        // Helper function to cleanly show errors
        function showError(message, detailedError = "") {
            document.getElementById('spin-ring').style.display = 'none';
            document.getElementById('status-text').innerHTML = "🛑 The reality portal collapsed!";
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<strong>Error:</strong> ${message}<br><br><span style="color:#aaa; font-size:12px;">${detailedError}</span>`;
        }

        async function generateHaluweb() {
            try {
                const response = await fetchWithTimeout("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    timeout: 15000, // 15 SECOND KILL SWITCH
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://pasterpo.github.io/HaluWeb/", 
                        "X-Title": "HaluWeb"
                    },
                    body: JSON.stringify({
                        // Exactly 3 models to obey OpenRouter's strict limits
                        "models": [
                            "meta-llama/llama-3.1-8b-instruct:free",
                            "google/gemma-2-9b-it:free",
                            "qwen/qwen-2-7b-instruct:free"
                        ], 
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Generate a fast, short, full-screen, funny website with working Picsum images." }
                        ]
                    })

                // If the key is dead or disabled, this clears it from memory
                if (response.status === 401) {
                    localStorage.removeItem("haluweb_key");
                    showError("API Key Rejected or Revoked.", "OpenRouter says your key is invalid. Refresh the page to enter a new one.");
                    return;
                }
                
                if (!response.ok) {
                    const errText = await response.text();
                    showError("Server Error from OpenRouter.", `Status Code: ${response.status}. Message: ${errText}`);
                    return;
                }

                const data = await response.json();
                
                if (!data.choices || data.choices.length === 0) {
                    showError("Empty Response.", "The AI returned a blank page. Try refreshing.");
                    return;
                }

                let aiHtml = data.choices[0].message.content;
                aiHtml = aiHtml.replace(/```html/g, "").replace(/```/g, "").trim();

                // Inject and display the generated website
                document.getElementById('loader').style.display = 'none';
                const container = document.getElementById('website-container');
                container.innerHTML = aiHtml;
                container.style.display = 'block';
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    showError("Generation Timed Out (15s limit).", "The free AI servers are too busy right now and took longer than 15 seconds. Hit refresh to try again!");
                } else {
                    showError("Network or Browser Error.", error.message);
                }
            }
        }

        // Only run if we actually have a key
        if (OPENROUTER_API_KEY) {
            generateHaluweb();
        } else {
            showError("No API Key Found.", "You didn't enter a key. Refresh to try again.");
        }
    </script>
</body>
</html>
