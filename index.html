<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haluweb - Full Experience</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; background: #0f0f16; font-family: sans-serif; color: #fff; }
        #loader { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #0f0; }
        .spinner { border: 4px solid #111; width: 40px; height: 40px; border-radius: 50%; border-top-color: #0f0; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* This wrapper fixes the "baby website" look */
        .page-wrapper { max-width: 800px; margin: 0 auto; padding: 20px; background: white; color: #333; min-height: 100vh; }
        
        #error-box { display: none; padding: 20px; color: #f00; }
        #website-container { width: 100%; display: none; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Forging a real website (2000 token limit)...</p>
        <div id="error-box"></div>
    </div>
    <div id="website-container"></div>

    <script>
        let key = localStorage.getItem("haluweb_key");
        if (!key) { key = prompt("API Key:"); localStorage.setItem("haluweb_key", key); }

        // The SYSTEM_PROMPT now forces a layout wrapper
        const SYSTEM_PROMPT = `
        You are Haluweb. Generate a bizarre, unhinged, long-scrolling website.
        
        CRITICAL RULES:
        1. WRAP ALL CONTENT in a single <div class="page-wrapper">...</div>.
        2. Content: You must write extensive text, lore, or fake news. No just-image-lists.
        3. Use CSS Grid or Flexbox inside the wrapper to make it look professional, not basic.
        4. Use picsum.photos for images. 
        5. Every button must have a prank 'onclick' alert.
        6. Make the page very long (scrollable).
        
        Output raw HTML only. No markdown.
        `;

        async function generate() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash-lite", 
                        "max_tokens": 2000, // <--- Bumping to 2000 tokens for real length
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Create a long, hilarious, high-quality, satirical website." }
                        ]
                    })
                });

                const data = await response.json();
                let html = data.choices[0].message.content.replace(/```html/g, "").replace(/```/g, "").trim();
                document.getElementById('loader').style.display = 'none';
                const cont = document.getElementById('website-container');
                cont.innerHTML = html;
                cont.style.display = 'block';
            } catch (err) {
                document.getElementById('error-box').style.display = 'block';
                document.getElementById('error-box').innerText = err.message;
            }
        }
        generate();
    </script>
</body>
</html>
