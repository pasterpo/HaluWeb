<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haluweb - Loading Reality...</title>
    <style>
        /* We removed the restrictive wrapper so the AI gets the full screen back! */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0f0f16;
        }

        #loader {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 22px;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0,255,204,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #website-container {
            width: 100%;
            min-height: 100vh;
            background: white;
            display: none; /* Hidden until the AI finishes typing */
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="status-text">🔮 Shifting dimensions...<br><span style="font-size: 14px; color: #888;">Harvesting peak internet chaos...</span></div>
    </div>
    
    <div id="website-container"></div>

    <script>
        const OPENROUTER_API_KEY = "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";

        const SYSTEM_PROMPT = `
        You are Haluweb, a chaotic, hilarious AI that invents completely fake, bizarre single-page websites.
        
        STRICT RULES FOR TOKENS & LAYOUT:
        1. KEEP IT SHORT. Do not generate massive pages. Use minimal, efficient HTML/CSS to save tokens. Max 2 or 3 distinct sections.
        2. Design it to look beautiful and normal on a full-screen desktop layout, but make the actual text/business idea completely unhinged and funny.
        
        STRICT RULE FOR IMAGES (CRITICAL):
        You MUST use exactly this URL format for images: "https://picsum.photos/seed/{random_word}/400/300". 
        Replace {random_word} with a word related to your concept. NEVER invent your own URLs. ALWAYS use this picsum format.
        
        BUTTON LOGIC:
        Every button must have a funny inline JavaScript 'onclick' alert that pranks the user or says something absurd.

        Output ONLY valid, raw HTML code. Do NOT wrap it in markdown code blocks (\`\`\`html).
        `;

        async function generateHaluweb() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://pasterpo.github.io/HaluWeb/", 
                        "X-Title": "HaluWeb"
                    },
                    body: JSON.stringify({
                        "model": "openrouter/free", // Keeps it strictly on the free tier
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Generate a fast, short, full-screen, funny website with working Picsum images." }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error("API Error");
                }

                const data = await response.json();
                let aiHtml = data.choices[0].message.content;

                // Clean up markdown blocks
                aiHtml = aiHtml.replace(/```html/g, "").replace(/
```/g, "").trim();

                // Inject and display
                document.getElementById('loader').style.display = 'none';
                const container = document.getElementById('website-container');
                container.innerHTML = aiHtml;
                container.style.display = 'block';
                
                const aiTitle = container.querySelector("title, h1");
                if (aiTitle) document.title = "Haluweb - " + aiTitle.innerText.substring(0, 30);

            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = "🛑 The reality portal collapsed! Refresh to try again.";
            }
        }

        generateHaluweb();
    </script>
</body>
</html>
