<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haluweb - Efficiency Mode</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; min-height: 100vh; background: #000; color: #fff; font-family: sans-serif; }
        #loader { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #0f0; }
        .spinner { border: 4px solid #111; width: 40px; height: 40px; border-radius: 50%; border-top-color: #0f0; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #error-box { display: none; padding: 20px; color: #f00; }
        #website-container { width: 100%; display: none; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner" id="spin-ring"></div>
        <p>Harvesting 1000 tokens of chaos...</p>
        <div id="error-box"></div>
    </div>
    <div id="website-container"></div>

    <script>
        let key = localStorage.getItem("haluweb_key");
        if (!key) { key = prompt("API Key:"); localStorage.setItem("haluweb_key", key); }

        // This prompt forces the AI to be efficient with its token budget
        const SYSTEM_PROMPT = `
        You are Haluweb. Generate a bizarre, unhinged website.
        
        EFFICIENCY RULES:
        1. USE MINIFIED HTML/CSS. Do not use unnecessary whitespace. 
        2. Keep the page structure dense. 
        3. You have a HARD 1000-token limit. If you reach 900 tokens, conclude immediately.
        4. Use picsum.photos for images. 
        5. Every button must have an 'onclick' prank alert.
        6. Keep CSS properly formatted, properly fitted in the screen, etc.
        
        Output raw HTML only. No markdown.
        `;

        async function generate() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash-lite", 
                        "max_tokens": 1000, // <--- THE HARD LIMIT
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Create a chaotic long-scroll website." }
                        ]
                    })
                });

                const data = await response.json();
                let html = data.choices[0].message.content.replace(/```html/g, "").replace(/```/g, "").trim();
                document.getElementById('loader').style.display = 'none';
                const cont = document.getElementById('website-container');
                cont.innerHTML = html;
                cont.style.display = 'block';
            } catch (err) {
                document.getElementById('error-box').style.display = 'block';
                document.getElementById('error-box').innerText = err.message;
            }
        }
        generate();
    </script>
</body>
</html>
