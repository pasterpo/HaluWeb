<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Haluweb - Debugging Mode</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; }
        #status-display { padding: 50px; text-align: center; color: #0f0; }
        .error-red { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <div id="status-display">
        <div id="msg">Initializing Haluweb...</div>
    </div>
    <div id="website-container"></div>

    <script>
        // 1. GLOBAL ERROR CATCHER: If anything crashes, it prints to screen
        window.onerror = function(msg, url, line) {
            document.getElementById('msg').innerHTML = `<p class="error-red">CRITICAL JS ERROR:</p><p>${msg}</p><p>Line: ${line}</p>`;
        };

        console.log("Script starting...");
        document.getElementById('msg').innerText = "Script started. Checking API Key...";

        let key = localStorage.getItem("haluweb_key");
        if (!key) { 
            key = prompt("API Key:"); 
            if(key) localStorage.setItem("haluweb_key", key); 
        }

        if (!key) {
            document.getElementById('msg').innerText = "No API Key provided. Aborting.";
        } else {
            document.getElementById('msg').innerText = "API Key found. Fetching from OpenRouter...";
            generate();
        }

        async function generate() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${key}`, 
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://pasterpo.github.io/HaluWeb/", 
                        "X-Title": "HaluWeb"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash-lite", 
                        "max_tokens": 1500, 
                        "messages": [
                            { "role": "system", "content": "You are a web developer. Return raw HTML only. Use <div class='wrapper'> for layout. Every button must have onclick='alert(\"Prank\")'." },
                            { "role": "user", "content": "Build a dark-mode landing page." }
                        ]
                    })
                });

                if(!response.ok) throw new Error("HTTP Error: " + response.status);

                const data = await response.json();
                console.log("Response received:", data);
                
                if(!data.choices || !data.choices[0].message.content) throw new Error("AI returned empty data.");

                let html = data.choices[0].message.content.replace(/```html/g, "").replace(/
```/g, "").trim();
                
                document.getElementById('status-display').style.display = 'none';
                const cont = document.getElementById('website-container');
                cont.innerHTML = html;
                cont.style.display = 'block';

            } catch (err) {
                document.getElementById('msg').innerHTML = `<p class="error-red">FETCH ERROR:</p><p>${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
