<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haluweb - Loading Reality...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        #loader {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 22px;
            background: #0f0f16;
            color: #00ffcc;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0,255,204,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #website-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div>🔮 Haluweb is shifting dimensions...<br><span style="font-size: 14px; color: #888;">Generating a deeply ridiculous website...</span></div>
    </div>
    
    <div id="website-container"></div>

    <script>
        const OPENROUTER_API_KEY = "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";

        const SYSTEM_PROMPT = `
        You are Haluweb, a chaotic, hilarious AI that invents completely fake, bizarre, and funny single-page websites. 
        Generate a single, complete HTML page (including full layout and embedded CSS styling inside a <style> tag). 
        
        The website must look like an absurd business, a fake unhinged startup, a bizarre hobbyist blog, or a local service from an alternate universe. 
        Examples of vibes: A company that rents aggressive geese for corporate security, a luxury artisanal water bar that only sells moisture collected from air conditioners, a support group for people who suspect their cat is plotting a corporate takeover.
        
        Make the copy incredibly funny, satirical, and strange. Add fake menus, pricing tables, testimonials from confused customers, and features. Ensure it has good layout structure and colors so it looks like a real (but crazy) website.
        
        Output ONLY valid, raw HTML code. Do NOT wrap it in markdown code blocks (\`\`\`html). Start directly with HTML elements or a container. Do not write any explanations outside the HTML code.
        `;

        async function generateHaluweb() {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "models": [
                            "meta-llama/llama-3.1-8b-instruct:free",
                            "google/gemini-2.5-flash-lite:free"
                        ],
                        "messages": [
                            { "role": "system", "content": SYSTEM_PROMPT },
                            { "role": "user", "content": "Invent a hilarious and completely random new website layout and concept right now." }
                        ]
                    })
                });

                const data = await response.json();
                
                if (!data.choices || data.choices.length === 0) {
                    throw new Error("No response from AI model.");
                }

                let aiHtml = data.choices[0].message.content;

                // Clean up any accidental markdown blocks if the AI ignored instructions
                aiHtml = aiHtml.replace(/```html/g, "").replace(/```/g, "").trim();

                // Remove the loader and inject the website
                document.getElementById('loader').style.display = 'none';
                document.getElementById('website-container').innerHTML = aiHtml;
                
                // Set the browser tab title automatically
                const aiTitle = document.querySelector("#website-container title");
                if (aiTitle) {
                    document.title = aiTitle.innerText;
                } else {
                    document.title = "Haluweb - Generated Reality";
                }

            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = "🛑 The reality portal collapsed! OpenRouter might be rate-limiting the free tier right now. Refresh to try again!";
            }
        }

        generateHaluweb();
    </script>
</body>
</html>
